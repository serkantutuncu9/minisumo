<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Türkiye STEM Yarışması | Mini Sumo Sonuçları</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #06101f;
      --panel: rgba(8, 18, 36, 0.82);
      --panel-strong: rgba(12, 24, 45, 0.96);
      --card: rgba(17, 30, 52, 0.88);
      --slot: rgba(255,255,255,0.045);
      --border: rgba(255,255,255,0.12);
      --text: #eef6ff;
      --muted: #9fb2cc;
      --cyan: #19d9ff;
      --blue: #2d8cff;
      --gold: #ffd21f;
      --gold-2: #b77900;
      --green: #00ff88;
      --red: #ff4d6d;
      --line: rgba(232, 246, 255, 0.82);
      --shadow: rgba(0,0,0,0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: 'Montserrat', 'Segoe UI', sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 6%, rgba(255, 210, 31, 0.15), transparent 26%),
        radial-gradient(circle at 16% 34%, rgba(25, 217, 255, 0.12), transparent 30%),
        radial-gradient(circle at 86% 72%, rgba(45, 140, 255, 0.10), transparent 34%),
        linear-gradient(135deg, #030712 0%, #07111f 45%, #0b1021 100%);
      overflow: hidden;
    }

    body.light-theme {
      --bg: #f6f8fc;
      --panel: rgba(255,255,255,0.82);
      --panel-strong: rgba(255,255,255,0.96);
      --card: rgba(255,255,255,0.94);
      --slot: rgba(15, 23, 42, 0.045);
      --border: rgba(15, 23, 42, 0.12);
      --text: #0f172a;
      --muted: #475569;
      --cyan: #0369a1;
      --blue: #2563eb;
      --gold: #92400e;
      --gold-2: #b77900;
      --green: #059669;
      --red: #dc2626;
      --line: rgba(71, 85, 105, 0.70);
      --shadow: rgba(15,23,42,0.12);
      background:
        radial-gradient(circle at 48% 8%, rgba(251, 191, 36, 0.15), transparent 30%),
        radial-gradient(circle at 16% 34%, rgba(14, 165, 233, 0.12), transparent 32%),
        linear-gradient(135deg, #ffffff 0%, #f8fafc 45%, #eaf1f8 100%);
    }

    button { font-family: inherit; }

    .page {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      display: grid;
      grid-template-columns: 320px 1fr 230px;
      align-items: center;
      gap: 18px;
      min-height: 88px;
      padding: 12px 24px;
      background: rgba(5, 10, 24, 0.88);
      border-bottom: 1px solid rgba(255, 210, 31, 0.22);
      box-shadow: 0 12px 32px rgba(0,0,0,0.28);
      backdrop-filter: blur(14px) saturate(130%);
      z-index: 50;
    }

    body.light-theme .topbar {
      background: rgba(255,255,255,0.94);
      border-bottom-color: rgba(15,23,42,0.10);
      box-shadow: 0 10px 26px rgba(15,23,42,0.10);
    }

    .left-head {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .home-btn,
    .top-control-btn {
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.08);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .home-btn {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      font-size: 21px;
    }

    .top-control-btn {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      font-size: 15px;
    }

    body.light-theme .home-btn,
    body.light-theme .top-control-btn {
      background: #f8fafc;
      border-color: rgba(15,23,42,0.13);
      color: #0f172a;
      box-shadow: 0 6px 16px rgba(15,23,42,0.08);
    }

    .panel-title {
      margin: 0;
      font-size: clamp(1.25rem, 1.8vw, 1.9rem);
      font-weight: 900;
      letter-spacing: 1px;
      white-space: nowrap;
      text-transform: uppercase;
      background: linear-gradient(90deg, #00d2ff 0%, #4aa3ff 45%, #00f2ff 70%, #00d2ff 100%);
      background-size: 240% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(32,184,255,0.28));
      animation: titleBlueShine 9s linear infinite;
    }

    @keyframes titleBlueShine {
      0% { background-position: -180% center; }
      100% { background-position: 180% center; }
    }

    body.light-theme .panel-title {
      background: linear-gradient(90deg, #0369a1 0%, #2563eb 48%, #0284c7 72%, #0369a1 100%);
      background-size: 240% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: none;
    }

    .main-title {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px 0 10px;
      overflow: visible;
    }

    .main-title .kicker {
      margin: 0;
      padding: 6px 0 9px;
      font-size: clamp(1.55rem, 2.85vw, 2.38rem);
      line-height: 1.18;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #b8860b 0%, #ffd21f 22%, #fff4a8 48%, #ffd21f 72%, #b8860b 100%);
      background-size: 260% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(255,210,31,0.18));
      animation: titleGoldShine 8s linear infinite;
      overflow: visible;
    }

    @keyframes titleGoldShine {
      0% { background-position: 180% center; }
      100% { background-position: -180% center; }
    }

    .main-title .subtitle {
      margin-top: 8px;
      font-size: clamp(0.82rem, 1.2vw, 1.05rem);
      line-height: 1.1;
      font-weight: 850;
      color: #f3c94a;
    }

    body.light-theme .main-title .kicker {
      background: linear-gradient(90deg, #7c2d12 0%, #b77900 25%, #d97706 48%, #b77900 75%, #7c2d12 100%);
      background-size: 260% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: none;
      animation: titleGoldShine 8s linear infinite;
    }

    body.light-theme .main-title .subtitle {
      color: #475569;
      text-shadow: none;
    }

    .right-head {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      gap: 7px;
      min-width: 0;
      overflow: hidden;
    }

    .clock {
      max-width: 100%;
      font-family: monospace;
      font-size: clamp(1.08rem, 1.6vw, 1.55rem);
      font-weight: 900;
      color: #e9fbff;
      white-space: nowrap;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(25,217,255,0.52);
    }

    body.light-theme .clock {
      color: #0f172a;
      text-shadow: none;
    }

    .live-pill {
      position: relative;
      display: flex;
      align-items: center;
      gap: 9px;
      max-width: 100%;
      padding: 9px 15px;
      border: 1px solid rgba(0,255,136,0.34);
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(0,255,136,0.16), rgba(0,255,136,0.055));
      color: #f8fffb;
      font-size: 0.76rem;
      font-weight: 900;
      white-space: nowrap;
      box-shadow:
        0 0 22px rgba(0,255,136,0.20),
        inset 0 0 18px rgba(0,255,136,0.08),
        inset 0 1px 0 rgba(255,255,255,0.10);
      overflow: hidden;
    }

    .live-pill::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      background: radial-gradient(circle at 18px 50%, rgba(0,255,136,0.34), transparent 34%);
      pointer-events: none;
    }

    .live-pill span {
      position: relative;
      z-index: 2;
    }

    body.light-theme .live-pill {
      background: linear-gradient(135deg, rgba(5,150,105,0.16), rgba(5,150,105,0.06));
      color: #064e3b;
      border-color: rgba(5,150,105,0.28);
      box-shadow: 0 0 18px rgba(5,150,105,0.12), inset 0 1px 0 rgba(255,255,255,0.65);
    }

    .live-dot {
      width: 14px;
      height: 14px;
      border-radius: 999px;
      background: #00ff88;
      box-shadow:
        0 0 0 4px rgba(0,255,136,0.12),
        0 0 12px rgba(0,255,136,0.95),
        0 0 26px rgba(0,255,136,0.68);
      animation: pulseLive 1.35s infinite ease-in-out;
      flex-shrink: 0;
    }

    .live-dot.warn { background: var(--gold); box-shadow: 0 0 8px var(--gold), 0 0 18px rgba(255,215,0,0.55); }
    .live-dot.err { background: var(--red); box-shadow: 0 0 8px var(--red), 0 0 18px rgba(255,77,109,0.55); }

    @keyframes pulseLive {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.78; }
    }

    .top-controls {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .stage-menu {
      z-index: 45;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(5, 10, 24, 0.82);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 24px rgba(0,0,0,0.16);
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
    }

    body.light-theme .stage-menu {
      background: rgba(255,255,255,0.92);
      border-bottom-color: rgba(15,23,42,0.08);
      box-shadow: 0 8px 20px rgba(15,23,42,0.08);
    }

    .stage-btn {
      height: 38px;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex: 0 0 auto;
      padding: 0 13px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.075);
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
      transition: transform .16s ease, color .16s ease, background .16s ease;
    }

    .stage-btn:hover { transform: translateY(-1px); color: var(--text); }
    .stage-btn.tree { color: var(--gold); border-color: rgba(255,210,31,0.22); }
    .stage-btn.active { background: linear-gradient(135deg, var(--cyan), var(--blue)); color: #06111f; border-color: rgba(25,217,255,0.42); }
    .stage-btn.final.active { background: linear-gradient(135deg, #ffd21f, #ff9f1a); color: #06111f; border-color: rgba(255,210,31,0.42); }

    body.light-theme .stage-btn {
      background: #ffffff;
      color: #334155;
      border-color: rgba(15,23,42,0.12);
      box-shadow: 0 4px 12px rgba(15,23,42,0.06);
    }

    body.light-theme .stage-btn.tree { color: #92400e; border-color: rgba(183,121,0,0.20); }
    body.light-theme .stage-btn.active { background: #dbeafe; color: #075985; border-color: rgba(3,105,161,0.25); }
    body.light-theme .stage-btn.final.active { background: #fde68a; color: #422006; border-color: rgba(183,121,0,0.26); }

    .stage-icon,
    .stage-trophy-img {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      object-fit: contain;
    }

    .content {
      flex: 1 1 auto;
      min-height: 0;
      padding: 10px 14px;
      overflow: hidden;
    }

    .grid-wrap {
      max-width: 1560px;
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .grid-view {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: repeat(4, minmax(0, 1fr));
      gap: 10px;
      overflow: hidden;
    }

    .pagination {
      flex: 0 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding-top: 10px;
      flex-wrap: wrap;
    }

    .page-btn {
      min-width: 94px;
      height: 38px;
      border-radius: 12px;
      border: 1px solid rgba(255,210,31,0.22);
      background: rgba(255,255,255,0.06);
      color: var(--gold);
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .page-btn.active { background: linear-gradient(135deg, #ffd21f, #ff9f1a); color: #06111f; }
    body.light-theme .page-btn { background: #ffffff; color: #92400e; border-color: rgba(183,121,0,0.18); }
    body.light-theme .page-btn.active { background: #fde68a; color: #422006; }

    .bracket-view {
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      position: relative;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.08);
      background:
        radial-gradient(circle at 50% 48%, rgba(255,210,31,0.09), transparent 36%),
        radial-gradient(circle at 18% 30%, rgba(25,217,255,0.08), transparent 32%),
        linear-gradient(135deg, rgba(255,255,255,0.055), rgba(255,255,255,0.018));
      backdrop-filter: blur(16px) saturate(125%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 20px 60px rgba(0,0,0,0.22);
    }

    body.light-theme .bracket-view {
      background:
        radial-gradient(circle at 50% 48%, rgba(255,255,255,0.82), transparent 42%),
        radial-gradient(circle at 50% 50%, rgba(251,191,36,0.08), transparent 36%),
        linear-gradient(135deg, rgba(255,255,255,0.88), rgba(241,245,249,0.70));
      border-color: rgba(15,23,42,0.08);
      box-shadow: 0 18px 44px rgba(15,23,42,0.08);
    }

    .split-bracket-stage {
      position: relative;
      height: 100%;
      min-height: 0;
      width: 100%;
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 230px minmax(0, 1fr);
      align-items: center;
      justify-items: center;
      gap: 116px;
      padding: 18px 20px;
      overflow: visible;
      transform-origin: center center;
    }

    .wing-bracket {
      position: relative;
      height: 520px;
      width: 100%;
      min-width: 0;
      z-index: 5;
    }

    .bracket-node {
      position: absolute;
      width: 190px;
      z-index: 9;
      overflow: visible;
    }

    .left-bracket .node-r16 { left: 0; }
    .left-bracket .node-qf { left: 245px; }
    .left-bracket .node-sf { left: 395px; }
    .right-bracket .node-r16 { right: 0; }
    .right-bracket .node-qf { right: 245px; }
    .right-bracket .node-sf { right: 395px; }

    .slot-y1 { top: 0; }
    .slot-y2 { top: 122px; }
    .slot-y3 { top: 276px; }
    .slot-y4 { top: 398px; }
    .slot-q1 { top: 62px; }
    .slot-q2 { top: 338px; }
    .slot-s1 { top: 200px; }

    .bracket-lines { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
    .line-h, .line-v { position: absolute; background: var(--line); box-shadow: 0 0 8px rgba(25,217,255,0.18); }
    .line-h { height: 3px; }
    .line-v { width: 3px; }

    .left-bracket .h-r16-1 { left: 190px; top: 57px; width: 40px; }
    .left-bracket .h-r16-2 { left: 190px; top: 179px; width: 40px; }
    .left-bracket .v-r16-a { left: 230px; top: 57px; height: 122px; }
    .left-bracket .h-r16-mid-a { left: 230px; top: 118px; width: 25px; }
    .left-bracket .h-r16-3 { left: 190px; top: 333px; width: 40px; }
    .left-bracket .h-r16-4 { left: 190px; top: 455px; width: 40px; }
    .left-bracket .v-r16-b { left: 230px; top: 333px; height: 122px; }
    .left-bracket .h-r16-mid-b { left: 230px; top: 394px; width: 25px; }
    .left-bracket .h-qf-1 { left: 435px; top: 118px; width: 8px; }
    .left-bracket .h-qf-2 { left: 435px; top: 394px; width: 8px; }
    .left-bracket .v-qf { left: 443px; top: 118px; height: 276px; }
    .left-bracket .h-qf-mid { left: 443px; top: 256px; width: 0; }
    .left-bracket .h-sf-final { left: 585px; top: 256px; width: 70px; background: rgba(255,210,31,0.78); }

    .right-bracket .h-r16-1 { right: 190px; top: 57px; width: 40px; }
    .right-bracket .h-r16-2 { right: 190px; top: 179px; width: 40px; }
    .right-bracket .v-r16-a { right: 230px; top: 57px; height: 122px; }
    .right-bracket .h-r16-mid-a { right: 230px; top: 118px; width: 25px; }
    .right-bracket .h-r16-3 { right: 190px; top: 333px; width: 40px; }
    .right-bracket .h-r16-4 { right: 190px; top: 455px; width: 40px; }
    .right-bracket .v-r16-b { right: 230px; top: 333px; height: 122px; }
    .right-bracket .h-r16-mid-b { right: 230px; top: 394px; width: 25px; }
    .right-bracket .h-qf-1 { right: 435px; top: 118px; width: 8px; }
    .right-bracket .h-qf-2 { right: 435px; top: 394px; width: 8px; }
    .right-bracket .v-qf { right: 443px; top: 118px; height: 276px; }
    .right-bracket .h-qf-mid { right: 443px; top: 256px; width: 0; }
    .right-bracket .h-sf-final { right: 585px; top: 256px; width: 70px; background: rgba(255,210,31,0.78); }

    .split-bracket-stage.stage-qf { grid-template-columns: minmax(0, 1fr) 280px minmax(0, 1fr); gap: 96px; padding: 34px 56px; }
    .stage-qf .wing-bracket { height: 540px; }
    .stage-qf .bracket-node { width: 250px; }
    .stage-qf .left-bracket .node-qf { left: 0; }
    .stage-qf .left-bracket .node-sf { left: 300px; }
    .stage-qf .right-bracket .node-qf { right: 0; }
    .stage-qf .right-bracket .node-sf { right: 300px; }
    .stage-qf .slot-q1 { top: 68px; }
    .stage-qf .slot-q2 { top: 348px; }
    .stage-qf .slot-s1 { top: 208px; }
    .stage-qf .left-bracket .h-qf-1 { left: 250px; top: 137px; width: 25px; }
    .stage-qf .left-bracket .h-qf-2 { left: 250px; top: 417px; width: 25px; }
    .stage-qf .left-bracket .v-qf { left: 275px; top: 137px; height: 280px; }
    .stage-qf .left-bracket .h-qf-mid { left: 275px; top: 277px; width: 25px; }
    .stage-qf .left-bracket .h-sf-final { left: 550px; top: 277px; width: 95px; }
    .stage-qf .right-bracket .h-qf-1 { right: 250px; top: 137px; width: 25px; }
    .stage-qf .right-bracket .h-qf-2 { right: 250px; top: 417px; width: 25px; }
    .stage-qf .right-bracket .v-qf { right: 275px; top: 137px; height: 280px; }
    .stage-qf .right-bracket .h-qf-mid { right: 275px; top: 277px; width: 25px; }
    .stage-qf .right-bracket .h-sf-final { right: 550px; top: 277px; width: 95px; }

    .split-bracket-stage.stage-sf { grid-template-columns: minmax(0, 1fr) 380px minmax(0, 1fr); gap: 86px; padding: 46px 70px; }
    .stage-sf .wing-bracket { height: 540px; }
    .stage-sf .bracket-node { width: 320px; }
    .stage-sf .left-bracket .node-sf { left: 50%; transform: translateX(-50%); }
    .stage-sf .right-bracket .node-sf { right: 50%; transform: translateX(50%); }
    .stage-sf .slot-s1 { top: 190px; }
    .stage-sf .left-bracket .h-sf-final { left: calc(50% + 160px); top: 285px; width: 145px; }
    .stage-sf .right-bracket .h-sf-final { right: calc(50% + 160px); top: 285px; width: 145px; }

    .match {
      position: relative;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.09);
      background: linear-gradient(145deg, rgba(17,30,52,0.78), rgba(7,11,24,0.64));
      padding: 7px;
      backdrop-filter: blur(14px) saturate(130%);
      box-shadow: 0 14px 34px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.07);
    }

    body.light-theme .match {
      background: #ffffff;
      border-color: rgba(15,23,42,0.10);
      box-shadow: 0 12px 28px rgba(15,23,42,0.09);
    }

    .match::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(25,217,255,0.06), transparent 50%, rgba(255,210,31,0.04));
      pointer-events: none;
    }

    body.light-theme .match::before { display: none; }
    .match.finished { border-color: rgba(255,210,31,0.34); }

    .match-head {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      color: var(--cyan);
      font-size: 9px;
      font-weight: 950;
      padding-bottom: 4px;
      margin-bottom: 5px;

        ['r16_2', '1002 - TitanForce', '1015 - RoboKing', '3', '1', '1002 - TitanForce'],
        ['r16_3', '1003 - MechaX', '1014 - IronFist', '0', '3', '1014 - IronFist'],
        ['r16_4', '1004 - VoltWarriors', '1013 - NanoTech', '3', '0', '1004 - VoltWarriors'],
        ['r16_5', '1005 - SteelHawks', '1012 - Alpha Bots', '3', '2', '1005 - SteelHawks'],
        ['r16_6', '1006 - TurboZ', '1011 - DarkEnergy', '3', '0', '1006 - TurboZ'],
        ['r16_7', '1007 - SkyNet', '1010 - Nexus Prime', '1', '3', '1010 - Nexus Prime'],
        ['r16_8', '1008 - Cyberium', '1009 - RoboStorm', '3', '0', '1008 - Cyberium'],
        ['qf_1', '1001 - Leonidas', '1002 - TitanForce', '3', '1', '1001 - Leonidas'],
        ['qf_2', '1014 - IronFist', '1004 - VoltWarriors', '0', '3', '1004 - VoltWarriors'],
        ['qf_3', '1005 - SteelHawks', '1006 - TurboZ', '2', '3', '1006 - TurboZ'],
        ['qf_4', '1010 - Nexus Prime', '1008 - Cyberium', '3', '1', '1010 - Nexus Prime'],
        ['sf_1', '1001 - Leonidas', '1004 - VoltWarriors', '3', '0', '1001 - Leonidas'],
        ['sf_2', '1006 - TurboZ', '1010 - Nexus Prime', '1', '3', '1010 - Nexus Prime'],
        ['f_1', '1001 - Leonidas', '1010 - Nexus Prime', '2', '1', '1001 - Leonidas']
      ];
      for (let i = 1; i <= 32; i++) rows.push([`r64_${i}`, `R64 Takım ${i * 2 - 1}`, `R64 Takım ${i * 2}`, '0', '0', '']);
      for (let i = 1; i <= 16; i++) rows.push([`r32_${i}`, `R32 Takım ${i * 2 - 1}`, `R32 Takım ${i * 2}`, '0', '0', '']);
      return normalizePayload({ success: true, data: rows.map(r => ({ sira: r[0], id: r[1], takimAdi: r[2], kolon4: r[3], kolon5: r[4], kolon6: r[5] })) });
    }

    function setConnection(state) {
      const dot = document.getElementById('liveDot');
      const liveText = document.getElementById('liveText');
      dot.classList.remove('warn', 'err');
      if (state === 'warn') { dot.classList.add('warn'); liveText.textContent = 'DEMO MOD'; }
      else if (state === 'err') { dot.classList.add('err'); liveText.textContent = 'BAĞLANTI HATASI'; }
      else { liveText.textContent = 'SİSTEM AKTİF'; }
    }

    async function fetchData() {
      try {
        setConnection('ok');
        const response = await fetch(`${scriptURL}?action=getScores&kategori=minisumo&t=${Date.now()}`, { cache: 'no-store' });
        const raw = await response.text();
        if (!response.ok) throw new Error(`HTTP ${response.status}: ${raw.slice(0, 160)}`);
        let payload;
        try { payload = JSON.parse(raw); }
        catch (err) { throw new Error(`API JSON yerine farklı içerik döndürdü: ${raw.slice(0, 160)}`); }
        allMatches = normalizePayload(payload);
        setConnection('ok');
        render();
      } catch (err) {
        console.error('Veri okuma hatası:', err);
        if (Object.keys(allMatches).length === 0) { allMatches = demoMatches(); setConnection('warn'); }
        else { setConnection('err'); }
        render();
      }
    }

    function updateClock() {
      document.getElementById('clock').textContent = new Date().toLocaleTimeString('tr-TR');
    }

    function trophyIconSmall(className = 'stage-trophy-img') {
      return `<img src="${trophyImageURL}" alt="Kupa" class="${className}">`;
    }

    function renderMenu() {
      const menu = document.getElementById('stageMenu');
      menu.innerHTML = stages.map(stage => {
        const icon = stage.icon === 'trophy' ? trophyIconSmall() : `<span class="stage-icon"><i class="fas ${stage.icon}"></i></span>`;
        return `<button class="stage-btn ${stage.tree ? 'tree' : ''} ${stage.final ? 'final' : ''} ${stage.key === activeStage ? 'active' : ''}" onclick="setStage('${stage.key}')">${icon}<span>${stage.label}</span></button>`;
      }).join('');
    }

    function setStage(stage) {
      activeStage = stage;
      activePage = 1;
      render();
    }

    function setPage(page) {
      activePage = page;
      render();
    }

    function maxCountFor(prefix) {
      const keys = Object.keys(allMatches).filter(key => key.startsWith(`${prefix}_`));
      if (keys.length) return Math.max(...keys.map(key => Number(key.split('_')[1])).filter(Boolean));
      return roundCounts[prefix] || 0;
    }

    function getMatch(key) {
      return allMatches[key] || defaultMatch(key);
    }

    function matchCard(match, label) {
      const m = Object.assign(defaultMatch(label), match || {});
      const isT1Winner = m.winner && m.winner === m.t1;
      const isT2Winner = m.winner && m.winner === m.t2;
      const finished = Boolean(m.winner);
      return `<div class="match ${finished ? 'finished' : ''}" id="box-${escapeHtml(m.id)}">
        <div class="match-head"><span>${escapeHtml(label)}</span><span>${finished ? '<i class="fas fa-check-circle" style="color:var(--green);"></i>' : '<i class="far fa-clock"></i>'}</span></div>
        <div class="slot ${isT1Winner ? 'winner' : finished ? 'loser' : ''} ${m.t1 === 'Bekleniyor...' ? 'empty' : ''}"><span class="name">${escapeHtml(m.t1)}</span><span class="score">${escapeHtml(m.s1)}</span></div>
        <div class="slot ${isT2Winner ? 'winner' : finished ? 'loser' : ''} ${m.t2 === 'Bekleniyor...' ? 'empty' : ''}"><span class="name">${escapeHtml(m.t2)}</span><span class="score">${escapeHtml(m.s2)}</span></div>
      </div>`;
    }

    function renderGrid(prefix) {
      const grid = document.getElementById('gridView');
      const pagination = document.getElementById('pagination');
      const count = maxCountFor(prefix);
      const pageCount = Math.max(1, Math.ceil(count / matchesPerPage));
      if (activePage > pageCount) activePage = pageCount;
      const start = (activePage - 1) * matchesPerPage + 1;
      const end = Math.min(count, activePage * matchesPerPage);

      grid.innerHTML = Array.from({ length: Math.max(0, end - start + 1) }, (_, index) => {
        const number = start + index;
        return matchCard(getMatch(`${prefix}_${number}`), `${matchLabelPrefixes[prefix]}${number}`);
      }).join('');

      pagination.innerHTML = pageCount > 1
        ? Array.from({ length: pageCount }, (_, i) => `<button class="page-btn ${activePage === i + 1 ? 'active' : ''}" onclick="setPage(${i + 1})">${i + 1}. Sayfa</button>`).join('')
        : '';
    }

    function cupOnly() {
      if (activeStage !== 'finals') {
        return `<div class="center-cup pre-final" id="cupCenter">
          <div class="trophy-stage">
            <span class="spark-ring"></span>
            <img class="trophy-img" src="${trophyImageURL}" alt="Türkiye STEM Yarışması Kupası">
          </div>
        </div>`;
      }

      const finalWinner = clean((allMatches['f_1'] || {}).winner, 'ŞAMPİYON BEKLENİYOR');
      return `<div class="center-cup" id="cupCenter"><div class="cup-card"><div class="trophy-img-wrap"><img class="trophy-img" src="${trophyImageURL}" alt="Türkiye STEM Yarışması Kupası"></div><div class="cup-label">ŞAMPİYONLUK KUPASI</div><div class="cup-sub">${escapeHtml(finalWinner)}</div></div></div>`;
    }

    function renderBracket(stage) {
      const container = document.getElementById('bracketStage');

      function fixedNode(prefix, number, cssClass) {
        return `<div class="bracket-node ${cssClass}" id="node-${prefix}_${number}">${matchCard(getMatch(`${prefix}_${number}`), `${matchLabelPrefixes[prefix]}${number}`)}</div>`;
      }

      function wing(side) {
        const isLeft = side === 'left';
        const r16List = stage === 'r16' ? (isLeft ? [1,2,3,4] : [5,6,7,8]) : [];
        const qfList = (stage === 'r16' || stage === 'qf') ? (isLeft ? [1,2] : [3,4]) : [];
        const sfList = isLeft ? [1] : [2];
        const r16Classes = ['slot-y1', 'slot-y2', 'slot-y3', 'slot-y4'];
        const qfClasses = ['slot-q1', 'slot-q2'];

        return `
          <div class="wing-bracket ${isLeft ? 'left-bracket' : 'right-bracket'}">
            <div class="bracket-lines">
              ${stage === 'r16' ? `
                <span class="line-h h-r16-1"></span><span class="line-h h-r16-2"></span><span class="line-v v-r16-a"></span><span class="line-h h-r16-mid-a"></span>
                <span class="line-h h-r16-3"></span><span class="line-h h-r16-4"></span><span class="line-v v-r16-b"></span><span class="line-h h-r16-mid-b"></span>
              ` : ''}
              ${stage === 'r16' || stage === 'qf' ? `
                <span class="line-h h-qf-1"></span><span class="line-h h-qf-2"></span><span class="line-v v-qf"></span><span class="line-h h-qf-mid"></span>
              ` : ''}
              <span class="line-h h-sf-final"></span>
            </div>
            ${r16List.map((n, i) => fixedNode('r16', n, `node-r16 ${r16Classes[i]}`)).join('')}
            ${qfList.map((n, i) => fixedNode('qf', n, `node-qf ${qfClasses[i]}`)).join('')}
            ${sfList.map(n => fixedNode('sf', n, 'node-sf slot-s1')).join('')}
          </div>
        `;
      }

      container.className = `split-bracket-stage stage-${stage}`;
      container.innerHTML = `${wing('left')}${cupOnly()}${wing('right')}`;
      requestAnimationFrame(() => setTimeout(fitBracketToScreen, 80));
    }

    function fitBracketToScreen() {
      if (isMobileView()) return;
      const view = document.getElementById('bracketView');
      const stage = document.getElementById('bracketStage');
      if (!view || !stage || view.style.display === 'none') return;

      stage.style.transform = 'scale(1)';
      stage.style.transformOrigin = 'center center';

      const availableW = Math.max(1, view.clientWidth - 4);
      const availableH = Math.max(1, view.clientHeight - 4);
      const neededW = Math.max(stage.scrollWidth, stage.getBoundingClientRect().width);
      const neededH = Math.max(stage.scrollHeight, stage.getBoundingClientRect().height);
      const scale = Math.min(availableW / neededW, availableH / neededH, 1);

      stage.style.transform = `scale(${scale})`;
    }

    function renderFinal() {
      const final = Object.assign(defaultMatch('f_1'), allMatches['f_1'] || {});
      const isT1Winner = final.winner && final.winner === final.t1;
      const isT2Winner = final.winner && final.winner === final.t2;
      const champion = clean(final.winner, 'ŞAMPİYON BEKLENİYOR');

      document.getElementById('finalView').innerHTML = `
        <div class="final-scoreboard">
          <div class="final-header">
            <div class="final-kicker">${trophyIconSmall('mini-trophy')}<span>BÜYÜK FİNAL</span>${trophyIconSmall('mini-trophy')}</div>
            <h2>ŞAMPİYONLUK MAÇI</h2>
          </div>
          <div class="score-row ${isT1Winner ? 'winner' : ''}"><div class="final-team">${escapeHtml(final.t1)}</div><div class="final-score">${escapeHtml(final.s1)}</div></div>
          <div class="score-row ${isT2Winner ? 'winner' : ''}"><div class="final-team">${escapeHtml(final.t2)}</div><div class="final-score">${escapeHtml(final.s2)}</div></div>
        </div>
        <div class="champion-panel">
          <div class="trophy-img-wrap"><img class="trophy-img" src="${trophyImageURL}" alt="Türkiye STEM Yarışması Şampiyon Kupası"></div>
          <div class="champ-label">${trophyIconSmall('mini-trophy')}<span>ŞAMPİYON</span>${trophyIconSmall('mini-trophy')}</div>
          <div class="champ-name">${escapeHtml(champion)}</div>
          <div class="champ-sub">TÜRKİYE STEM YARIŞMASI 2026</div>
        </div>
      `;
    }

    function render() {
      renderMenu();
      const subtitle = { eleme: 'Ön Eleme Turları', r64: 'Son 64 Maçları', r32: 'Son 32 Maçları', r16: 'Son 16 Eşleşme Ağacı', qf: 'Çeyrek Final Eşleşme Ağacı', sf: 'Yarı Final Eşleşme Ağacı', finals: 'Büyük Final ve Şampiyon' }[activeStage] || 'Mini Sumo Robot Yarışması';
      document.getElementById('stageSubtitle').textContent = subtitle;

      const gridWrap = document.getElementById('gridWrap');
      const bracket = document.getElementById('bracketView');
      const final = document.getElementById('finalView');

      gridWrap.style.display = 'none';
      bracket.style.display = 'none';
      final.style.display = 'none';

      if (activeStage === 'r16' || activeStage === 'qf' || activeStage === 'sf') {
        bracket.style.display = 'block';
        renderBracket(activeStage);
      } else if (activeStage === 'finals') {
        final.style.display = 'grid';
        renderFinal();
      } else {
        gridWrap.style.display = 'flex';
        renderGrid(activeStage);
      }
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    }

    window.addEventListener('resize', () => {
      if (activeStage === 'r16' || activeStage === 'qf' || activeStage === 'sf') setTimeout(fitBracketToScreen, 80);
    });

    updateClock();
    setInterval(updateClock, 1000);
    render();
    fetchData();
    refreshTimer = setInterval(fetchData, refreshMs);
  </script>
</body>
</html>
